<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sdaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#0f2340"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#sdaGradient)" stroke="#c9a962" stroke-width="2"/>
  
  <!-- Cross -->
  <path d="M100 40 L100 160 M60 100 L140 100" stroke="#c9a962" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Three angels silhouettes -->
  <g fill="#ffffff" opacity="0.9">
    <!-- Angel 1 (left) -->
    <path d="M55 70 Q55 60 65 55 Q75 50 75 60 L75 90 Q75 100 65 105 Q55 110 55 100 Z"/>
    <circle cx="65" cy="52" r="8"/>
    
    <!-- Angel 2 (center) -->
    <path d="M95 60 Q95 50 105 45 Q115 40 115 50 L115 80 Q115 90 105 95 Q95 100 95 90 Z"/>
    <circle cx="105" cy="42" r="8"/>
    
    <!-- Angel 3 (right) -->
    <path d="M135 70 Q135 60 145 55 Q155 50 155 60 L155 90 Q155 100 145 105 Q135 110 135 100 Z"/>
    <circle cx="145" cy="52" r="8"/>
  </g>
  
  <!-- Flames/Books (symbols of the three angels' messages) -->
  <g fill="#c9a962" opacity="0.8">
    <ellipse cx="65" cy="115" rx="12" ry="6"/>
    <ellipse cx="105" cy="105" rx="12" ry="6"/>
    <ellipse cx="145" cy="115" rx="12" ry="6"/>
  </g>
</svg>

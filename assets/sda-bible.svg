<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bibleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513"/>
      <stop offset="100%" style="stop-color:#654321"/>
    </linearGradient>
  </defs>
  <!-- Bible cover -->
  <rect x="40" y="30" width="120" height="140" rx="5" fill="url(#bibleGrad)"/>
  <!-- Pages -->
  <rect x="45" y="35" width="110" height="130" rx="3" fill="#f5f5dc"/>
  <!-- Cross on cover -->
  <path d="M100 50 L100 120 M70 80 L130 80" stroke="#8B4513" stroke-width="6" stroke-linecap="round"/>
  <!-- Book spine -->
  <rect x="40" y="30" width="8" height="140" fill="#654321"/>
</svg>
